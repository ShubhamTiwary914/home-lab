version: '3'

services:

#Filebrowser NAS------------
  filesys-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "1726:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./filesys/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lab_filesys

  filesys:
    image: filebrowser/filebrowser:v2.63.1
    volumes:
      - /home/lab:/srv
      - ./filesys/db/:/database/
      - ./filesys/config/settings.json:/config/settings.json:ro
      - ./filesys/log:/log
    environment:
      - FB_USERNAME=${FILEBROWSER_USERNAME}
      - FB_PASSWORD=${FILEBROWSER_PASSWORD}
    user: "1000:1000"
    networks:
      - lab_filesys
    restart: unless-stopped


#Model Routing ------------
  ollama_c1:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_c1:/root/.ollama
    networks:
        - lab_modelsrouter
  
  ollama_c2:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_c2:/root/.ollama
    networks:
        - lab_modelsrouter

  olla:
    image: ghcr.io/thushan/olla:latest
    restart: unless-stopped
    ports:
      - "40114:40114"
    volumes:
      - ./modelrouter/config/olla.yaml:/app/config.yaml:ro
    networks:
      - lab_modelsrouter
    depends_on:
      - ollama_c1
      - ollama_c2

  modelsrouter-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "40000:80"
    environment:
      - MODELS_API=${MODELS_API}
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./modelrouter/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: /bin/sh -c "envsubst '$$MODELS_API' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    networks:
      - lab_modelsrouter


#Blog & Editor ------
  blog-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "5000:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./blog/nginx/main.conf:/etc/nginx/nginx.conf:ro
      - ./blog/public/:/content
    networks:
      - lab_blogs

  # blogEditor-nginx:
  #   image: nginx:alpine3.23-slim
  #   ports:
  #     - "5010:80"
  #   volumes:
  #     - /etc/letsencrypt/:/etc/letsencrypt/
  #     - ./blog/nginx/editor.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     - lab_blogs

  # blogEditor:
  #   image: ghcr.io/silverbulletmd/silverbullet:latest
  #   restart: unless-stopped
  #   environment:
  #     - SB_USER=${SILVERBULLET_USERNAME}:${SILVERBULLET_PASSWORD}
  #   volumes:
  #     - ./blog/content:/space
  #   networks:
  #       - lab_blogs
  
networks:
  lab_filesys:
    driver: bridge
  lab_modelsrouter:
  lab_blogs:

volumes:
  ollama_c1:
  ollama_c2:

version: '3'

services:

#Filebrowser NAS------------
  filesys-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "1726:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./filesys/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lab_filesys

  filesys:
    image: filebrowser/filebrowser:v2.63.1
    volumes:
      - /home/lab:/srv
      - ./filesys/db/:/database/
      - ./filesys/config/settings.json:/config/settings.json:ro
      - ./filesys/log:/log
    environment:
      - FB_USERNAME=${FILEBROWSER_USERNAME}
      - FB_PASSWORD=${FILEBROWSER_PASSWORD}
    user: "1000:1000"
    networks:
      - lab_filesys
    restart: unless-stopped


#Blog & Editor ------
  blog-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "5000:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./blog/nginx/main.conf:/etc/nginx/nginx.conf:ro
      - ./blog/public/:/content
    networks:
      - lab_blogs

# CV page
  portfolio-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "5020:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./portfolio/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./portfolio/dist/client/:/content
    networks:
      - lab_blogs

# Analytics -----
  #port: 3000
  analytics:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:umami@lab_db:5432/umami
      APP_SECRET:  ${UMAMI_APP_SECRET}
    depends_on:
      - lab_db
    restart: unless-stopped
    networks:
      - lab_blogs

  analytics-nginx:
    image: nginx:alpine3.23-slim
    ports:
      - "3001:80"
    volumes:
      - /etc/letsencrypt/:/etc/letsencrypt/
      - ./analytics/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lab_blogs


#Shared DB------
  lab_db:
    image: postgres:16
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - lab_db:/var/lib/postgresql/data
    restart: unless-stopped 
    networks:
      - lab_blogs


networks:
  lab_filesys:
    driver: bridge
  lab_blogs:
  dbnet:
    driver: bridge


volumes:
  lab_db:
  postgres_data:
  mysql_data:

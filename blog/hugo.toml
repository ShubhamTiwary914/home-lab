baseURL = 'https://blog.shubhamtw.xyz/'
locale = 'en-us'
title = "shubhamtw's blog"
theme = 'terminal'
disablePathToLower = true

[permalinks]
  posts = '/posts/:contentbasename/'

[markup.goldmark.renderHooks.link]
	useEmbedded = 'always'

[params]
	#show TOC of content/posts
	Toc = false
	# TocTitle = "Table of Contents"
	contentTypeName = "posts"
	
	fullWidthTheme = false
	#use `cover.(jpg|png|webp)` as cover
	autoCover = true

	dateFormat = "2006-01-02 3:04:06 PM UTC"
	
	[render_hooks]
		[link]
			errorLevel = 'warning'
		[image]
			errorLevel = 'warning'


[languages]
  [languages.en]
    languageName = "English"
    title = "Shubhamtw's blogs"

    [languages.en.params]
      subtitle = "random shit posts.."
      owner = ""
      keywords = ""
      copyright = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "Shubhamtw's blog"
        logoHomeLink = "/"

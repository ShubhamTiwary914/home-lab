{{ if eq .Type "alert" }}
<blockquote class="alert alert-{{ .AlertType }}">
  <p class="alert-heading">
    <strong>{{ with .AlertTitle }}{{ . }}{{ else }}{{ title .AlertType }}{{ end }}</strong>
  </p>
  {{ .Text }}
</blockquote>
{{ else }}
<blockquote>
  {{ .Text }}
</blockquote>
{{ end }}

<style>
.alert { padding: 1em; margin: 1em 0; border-left: 4px solid; }
.alert-note { border-color: #0ea5e9; background: #0ea5e920; }
.alert-warning { border-color: #f59e0b; background: #f59e0b20; }
.alert-important { border-color: #a855f7; background: #a855f720; }
.alert-tip { border-color: #22c55e; background: #22c55e20; }
.alert-caution { border-color: #ef4444; background: #ef444420; }

blockquote {
    border-left: 4px solid var(--accent);
    border-top: none;
    border-bottom: none;
    padding: 0 0 0 1em;
    margin: 1em 0;
}

blockquote::before {
    display: none;
}
</style>

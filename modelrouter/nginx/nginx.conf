user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 512;
	multi_accept on;
}

http {
	
	#rate limit
	limit_req_zone $binary_remote_addr zone=iplimitBuf:20m rate=30r/s;
	access_log /var/log/nginx/access.log;

	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;
	client_header_buffer_size    1k;	
	

	#LOG + COMPRESSIONS
	log_format main '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$gzip_ratio"';
	
	include /etc/nginx/mime.types;

	server {
		listen 80 ssl;
		listen [::]:80 ssl;
		server_name models.shubhamtw.xyz;

		ssl_certificate /etc/letsencrypt/live/models.shubhamtw.xyz/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/models.shubhamtw.xyz/privkey.pem;
		ssl_trusted_certificate /etc/letsencrypt/live/models.shubhamtw.xyz/chain.pem;

		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_prefer_server_ciphers on;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;

		limit_req zone=iplimitBuf burst=30 nodelay;
		client_max_body_size 32m;

		error_page  404  /404.html;
		error_page 500 502 503 504 /50x.html;

		location / {
			if ($http_authorization != "Bearer ${MODELS_API}") {
				return 401;
			}
		    proxy_pass http://olla:40114/;
		    proxy_http_version 1.1;
		    proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
   		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    proxy_buffering off;
		}
	}
}


